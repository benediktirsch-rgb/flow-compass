name: Deploy Flow Compass Demo nach KAS (demo.vishnuartists.com)

# Nur die anonymisierte Demo (site/compass-demo, gebaut von build-compass-produkt.ps1) geht über
# GitHub live. Die persönliche Instanz (site/compass) ist nicht im Repo und wird von
# publish-compass.ps1 direkt per FTPS hochgeladen; Kundeninstanzen ebenso.
# Eigener Sync-State (nicht der des aufgelösten Repos analytics-dashboard): ein fremder State
# würde beim ersten Lauf Dateien löschen, die hier nicht liegen.
# Seit 03.09.2026 ist das Ziel die Subdomain demo.vishnuartists.com (eigenes Dokumentenverzeichnis
# im KAS) statt des geteilten Domain-Ordners von vishnu-artists.de — ein Ziel je Repo. publish-compass.ps1
# lädt dieselben Bytes zusätzlich per FTPS hoch (eigener Hash-Stand); solange dem Repo die Secrets
# FTP_SERVER/FTP_USERNAME/FTP_PASSWORD fehlen, ist das der einzige Weg, der wirklich ausliefert.

on:
  push:
    branches: [ main ]
    paths:
      - 'site/compass-demo/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTPS-Deploy Compass-Demo
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/compass-demo/
          server-dir: ./demo.vishnuartists.com/
          state-name: .ftp-deploy-flow-compass-demo-subdomain-state.json
