<style>
/* ==========================================================================
   Mein Portal — die Startseite einer persönlichen Subdomain (04.09.2026, v2 07.09.2026).
   <vorname>.vishnuartists.com führt an einer Stelle zusammen, was vorher auf
   vier Adressen mit vier Logins lag: Backstage/Profil, Team-Cockpit, Vaikuntha
   und der Flow Compass (der liegt hier daneben in /compass/).

   v2 (07.09.2026, Bene: „Meine Einstiegsseite ist sehr dürftig … modern und im Style
   von vishnuartists.com"): Typografie und Bausteine der Website (Instrument Serif für
   Überschriften, Inter im Lauftext, Kicker, Karten, Pillen-Knöpfe, Lotus-Logo) und
   unter den Kacheln die BEREICHE — CRM, Freelancer-Pool (FAP & JAP), Finanz-Raumschiff
   mit allen Entitäten, Vishnu-Backend, Vaikuntha-Backend. Jeder Bereich ist opt-in
   (portal.js › bereiche), weil er Rückseiten zeigt, die nicht jede Person etwas angehen.

   v3 (11.09.2026, Bene: „gib allen Zugriff auf eine Übersicht wie bene. — auf der
   Berechtigungsebene, auf der sie stehen — Links zu allen Portalen mit Unterlinks"): die
   Bereiche sind nicht mehr opt-in, sondern folgen den Rechten. Jeder Bereich, jede Spalte,
   jede Zeile trägt, was ihre Zielseite verlangt (darf = CRM-Rollen, crew = Raumschiff-Rolle,
   verein = Stufe bei Vaikuntha) — abgeschrieben aus den Prüfungen der Zielseiten, nicht
   geraten. Die Rollen kommen live aus der Tür (gate.php?wer=1, aus weiter.php beim Anmelden),
   Rückfall ist portal.js › rollen. Neu dazu: „Mein Vishnu“ und „Flow“ mit den Absprüngen in
   Compass und Team-Cockpit und allen Portalen des Kollektivs. Ein Link ist keine Berechtigung —
   jede Zielseite prüft weiter selbst; das Portal zeigt nur nicht, was ohnehin verschlossen wäre.

   Farben sind die Tokens der Website (f/vf.css), damit das Portal zum Auftritt
   des Kollektivs gehört und nicht wie ein zweites Produkt aussieht. Der
   Dunkelmodus teilt sich den Schlüssel 'beneTheme' mit dem Compass — gleicher
   Ursprung, eine Entscheidung, beide Seiten folgen ihr.
   ========================================================================== */
:root{
  --paper:#faf8f2; --surface:#f3f0e6; --card:#ffffff;
  --ink:#1c2314; --sub:#686f5d; --line:#e6e2d4; --line-strong:#d5d0bd;
  --green:#89c527; --green-d:#4f7418; --green-soft:#eef4de;
  --violet:#6544ea; --violet-soft:#efeaff;
  --amber-d:#8a6008; --amber-soft:#fdf0d4;
  --radius:16px; --shadow:0 2px 12px rgba(40,46,28,.07);
  --top:rgba(250,248,242,.88);
}
html[data-theme="dark"]{
  --paper:#11150d; --surface:#171c11; --card:#1b2114;
  --ink:#eef2e4; --sub:#a4ac95; --line:#2b3421; --line-strong:#3b482c;
  --green:#a3dc45; --green-d:#c7ec8a; --green-soft:#25311a;
  --violet:#a08cff; --violet-soft:#26204a;
  --amber-d:#e0b25a; --amber-soft:#3a2f12;
  --shadow:0 2px 14px rgba(0,0,0,.35);
  --top:rgba(17,21,13,.88);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3{font-family:'Instrument Serif',Georgia,serif;font-weight:400;line-height:1.08;letter-spacing:-.01em;margin:0}
h1 em,h2 em{font-style:italic;color:var(--green-d)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.kick{color:var(--green-d);font-weight:700;letter-spacing:2.2px;font-size:11.5px;text-transform:uppercase;font-family:Inter;margin:0}
.lead{color:var(--sub);max-width:62ch;font-size:16px;margin:10px 0 0}

/* ---------- Kopf: wie header.vf der Website — schwebend, leicht durchscheinend --------- */
header.top{position:sticky;top:0;z-index:60;background:var(--top);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:7px;height:68px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17.5px;letter-spacing:.2px;text-decoration:none}
.logo img{width:28px;height:28px;border-radius:8px;display:block}
.logo b{color:var(--green-d)}
.logo .pill{font-weight:600;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-left:6px}
.nav .sp{flex:1}
.navlinks{display:flex;gap:2px;align-items:center}
.navlinks a{color:var(--sub);text-decoration:none;font-size:13px;font-weight:600;padding:9px 10px;border-radius:999px;white-space:nowrap}
.navlinks a:hover{color:var(--ink)}
.kn{background:var(--card);border:1.5px solid var(--line);color:var(--sub);border-radius:999px;
  padding:6px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;margin-left:4px}
.kn:hover{border-color:var(--line-strong);color:var(--ink)}

/* ---------- Begrüßung ---------------------------------------------------------------- */
.hero{padding:44px 0 30px}
.hero h1{font-size:clamp(36px,5.2vw,60px);margin:10px 0 0;max-width:18ch}
.ebene{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--sub)}
.ebene .chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:2px 10px;font-weight:600;color:var(--ink)}
.ebene .chip.v{border-color:var(--violet-soft);background:var(--violet-soft)}
.ebene .chip.a{border-color:var(--amber-soft);background:var(--amber-soft)}

/* ---------- Kacheln: die Karten der Website (.card), eine Reihe für die Hauptwege ----- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:16px}
.tile{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;
  box-shadow:var(--shadow);transition:transform .25s,box-shadow .25s,border-color .25s}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);box-shadow:0 10px 28px rgba(40,46,28,.11);border-color:var(--green);outline:none}
.tile:focus-visible{box-shadow:0 0 0 3px var(--green-soft)}
.tile .ic{font-size:28px;line-height:1}
.tile h2{font-size:23px;margin-top:4px}
.tile p{margin:0;color:var(--sub);font-size:13.5px;line-height:1.5}
.tile .go{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:13px;font-weight:800;color:var(--green-d)}
.tile .host{color:var(--sub);font-weight:600;font-size:12px}
.tile.haupt{background:linear-gradient(155deg,var(--green-soft),var(--card) 62%);border-color:var(--green)}
.tile .kbd{position:absolute;top:12px;right:14px;font-size:11px;color:var(--sub);font-weight:700}

/* ---------- Bereiche: die Rückseiten, je eine Sektion mit Spalten --------------------- */
.bereich{margin-top:44px;padding-top:26px;border-top:1px solid var(--line)}
.bk{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.bk .bic{width:52px;height:52px;border-radius:14px;background:var(--surface);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.bk .bt{flex:1;min-width:240px}
.bk h2{font-size:clamp(26px,3.2vw,36px);margin:2px 0 4px}
.bk .sub{margin:0;color:var(--sub);font-size:14.5px;max-width:64ch}
.btn{background:var(--green);color:#122005;border:none;border-radius:999px;padding:10px 18px;font-weight:800;font-size:13.5px;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:Inter;transition:.2s;white-space:nowrap;align-self:center}
.btn:hover{background:var(--green-d);color:#fff;transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line-strong);color:var(--ink)}
.btn.ghost:hover{border-color:var(--green-d);background:var(--green-soft);color:var(--ink);transform:none}
html[data-theme="dark"] .btn{color:#11150d} html[data-theme="dark"] .btn:hover{color:#11150d}
html[data-theme="dark"] .btn.ghost{color:var(--ink)}
.spalten{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:18px}
.spalte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px 14px;box-shadow:var(--shadow)}
.spalte h4{margin:0 0 8px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);font-family:Inter}
.spalte ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.spalte a{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);font-size:14px;
  padding:4px 6px;margin:0 -6px;border-radius:8px;transition:background .15s,color .15s}
.spalte a:hover,.spalte a:focus-visible{background:var(--green-soft);color:var(--green-d);outline:none}
.spalte a .ic2{font-size:14px;flex:none;width:19px}
.spalte a .ext{margin-left:auto;font-size:11px;color:var(--sub);font-weight:600}
.spalte a.hier{font-weight:700}
.spalte a.hier .ext{color:var(--green-d)}
@media(max-width:900px){ .navlinks{display:none} }

/* ---------- Zweite Ebene: selten gebraucht, ohne Kachel-Optik ------------------------- */
.mehr{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 26px}
.mehr h3{margin:0 0 7px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);font-family:Inter}
.mehr ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.mehr a{display:flex;align-items:baseline;gap:7px;text-decoration:none;color:var(--ink);font-size:13.5px;padding:2px 0;border-radius:6px}
.mehr a:hover,.mehr a:focus-visible{color:var(--green-d);outline:none}
.mehr a .ic2{font-size:13px;flex:none;width:17px}
footer{margin-top:44px;padding:20px 0 56px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px}
footer b{color:var(--ink);font-weight:700}
footer a{color:var(--green-d)}

/* Große Schrift (portal.js › gross:true, 06.09.2026 für Martin) */
body.gross{font-size:18px}
body.gross .tile h2{font-size:27px} body.gross .tile p{font-size:16px} body.gross .tile .go{font-size:15px}
body.gross .spalte a{font-size:16.5px} body.gross .mehr a{font-size:16px} body.gross .lead{font-size:18.5px} body.gross .kn{font-size:14.5px}
body.gross .grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
@media(max-width:640px){ .hero{padding:30px 0 22px} .tile .kbd{display:none} .nav{height:60px} .logo .pill{display:none} footer{padding-bottom:40px} }
@media(prefers-reduced-motion:reduce){ .tile,.btn{transition:none} html{scroll-behavior:auto} }
</style>
</head>

<!-- Die Instanz des Compass liefert Name und Mailadresse (eine Pflegestelle, nicht zwei).
     Fehlt sie, läuft das Portal trotzdem — dann zählt allein portal.js. -->
<script src="compass/instanz.js" onerror="void 0"></script>
<script src="portal.js"></script>
<script>
/* ---------- Konfiguration zusammenlegen: portal.js gewinnt, instanz.js füllt auf ----- */
var P = window.PORTAL || {};
var I = window.COMPASS_INSTANZ || {};
var NAME = P.name || I.name || '';
var INSTANZ = P.person || I.kunde || '';
if (P.gross) document.body.classList.add('gross');

/* ---------- Berechtigungsebene (v3, 11.09.2026) --------------------------------------
   ROLLEN  CRM-Rollen der Person, die gerade schaut. Zuerst aus portal.js (Stand beim
           Einrichten), dann live aus der Tür (gate.php?wer=1 — die Tür bekommt sie beim
           Anmelden von weiter.php). Live gewinnt: wer eine Rolle verliert, verliert den Link.
   CREW    Rolle im Finanz-Raumschiff (kapitaen · firma · vertraege). Keine CRM-Rolle,
           sondern eine feste Liste in raumschiff/zugang.php — deshalb nur aus portal.js.
   VEREIN  Stufe bei Vaikuntha (admin · vorstand · beirat · mitglied). Das CRM von
           vishnuartists.com kennt sie nicht (Zwei Häuser, 02.09.2026) — nur aus portal.js. */
var ROLLEN = Array.isArray(P.rollen) ? P.rollen.slice() : [];
var ROLLEN_QUELLE = ROLLEN.length ? 'hinterlegt' : '';   /* 'live' nach der Antwort der Tür */
var CREW = String(P.crew || '');
var VEREIN = String(P.verein || '');
var VSTUFE = { mitglied:2, beirat:3, vorstand:4, admin:5 };
/* Was die Zielseiten verlangen — abgeschrieben aus ihren Prüfungen (Stand 11.09.2026):
     crm.php:64                         gruender · intern · finanzen
     portal-admin.php, pool-kpi.php,
     dubletten.php (vf_portal_pflegt)   gruender · intern
     finanzlauf/*                       gruender · finanzen
     portal.php (VF_PORTAL_ROLLEN)      Kollektiv + Anwärter + finanzen
     va./gate-config.php                gruender · intern · vertrag · coach · trainer */
var R = {
  crm:     ['gruender','intern','finanzen'],
  pflege:  ['gruender','intern'],
  finanz:  ['gruender','finanzen'],
  portal:  ['gruender','intern','vertrag','freelancer','trainer','coach','partner','aspirant','alumni','finanzen'],
  cockpit: ['gruender','intern','vertrag','coach','trainer'],
  gruender:['gruender']
};

/* ---------- Sprache: Deutsch und Englisch (VA-13529: Marwan liest Englisch) ---------- */
var TEXTE = {
  de: { gruss:['Guten Morgen','Guten Tag','Guten Abend'],
        lead:'Deine Werkzeuge an einer Stelle. Ein Login, alle Wege.',
        kick:'Persönliches Portal', oeffnen:'Öffnen', hier:'hier auf dieser Seite', extern:'extern',
        fuss:'Persönliches Portal · geschützt wie das Team-Cockpit · Fragen an ', sprache:'EN', pill:'Mein Portal',
        ebene:'Du siehst, was deine Rechte öffnen:', live:'laut Anmeldung', hinterlegt:'hinterlegt',
        crew:'Raumschiff', verein:'Verein', duHier:'du bist hier' },
  en: { gruss:['Good morning','Hello','Good evening'],
        lead:'Your tools in one place. One login, every way in.',
        kick:'Personal portal', oeffnen:'Open', hier:'here on this site', extern:'external',
        fuss:'Personal portal · protected like the team cockpit · questions to ', sprache:'DE', pill:'My portal',
        ebene:'You see what your access opens:', live:'from your sign-in', hinterlegt:'on file',
        crew:'Spaceship', verein:'Association', duHier:'you are here' }
};
var NAMEN = {
  gruender:['Gründung','Founders'], intern:['Kern-Team','Core team'], finanzen:['Finanzen','Finance'],
  vertrag:['Vertrag','Contract'], freelancer:['Freelancer','Freelancer'], trainer:['Trainer:in','Trainer'],
  coach:['Coach','Coach'], partner:['Partner','Partner'], aspirant:['Aspirant:in','Aspirant'], alumni:['Alumni','Alumni'],
  kapitaen:['Kapitän','Captain'], firma:['Firma','Company'], vertraege:['Verträge','Contracts'],
  admin:['Administration','Admin'], vorstand:['Vorstand','Board'], beirat:['Beirat','Advisory board'], mitglied:['Mitglied','Member']
};
var SPR = (function(){
  try { var g = localStorage.getItem('portalSprache'); if (g) return g; } catch(e){}
  if (P.sprache) return P.sprache;
  return (navigator.language || 'de').slice(0,2) === 'en' ? 'en' : 'de';
})();

/* ---------- Adressen, die mehrfach vorkommen ---------------------------------------- */
var VA   = 'https://vishnuartists.com/';
var JIRA = 'https://vishnuartists.atlassian.net/jira/software/projects/';
/* Vaikuntha-Backend über das Sprungbrett (SSO, 04.09.2026): weiter.php stellt ein
   Einmal-Ticket aus, die Route /wp-json/vishnu/v1/anmelden meldet die Person in WordPress
   an und schickt sie auf den gewünschten Pfad — kein zweites Login. */
function vk(pfad){
  return VA + 'weiter.php?zu=' + encodeURIComponent('https://vaikuntha.eu/wp-json/vishnu/v1/anmelden?zu=' + encodeURIComponent(pfad));
}
function wp(seite){ return vk('/wp-admin/admin.php?page=' + seite); }

/* ---------- Kacheln: Standard ist das, was jede Person im Kollektiv hat -------------- */
var STANDARD = [
  { id:'compass', icon:'🧭', url:'./compass/', haupt:true,
    de:['Flow Compass','Dein Morgencheck, dein Board, deine Kennzahlen — was als Nächstes zählt.'],
    en:['Flow Compass','Your morning check, your board, your numbers — what matters next.'] },
  { id:'cockpit', icon:'📊', url:'https://va.vishnuartists.com/',
    de:['Team-Cockpit','Flight Levels, Aging, Analysen — woran das Team gerade arbeitet.'],
    en:['Team cockpit','Flight levels, aging, analytics — what the team is working on.'] },
  /* backstage.html, nicht backstage.php: die .php ist das Relay für die fünf Meldungen
     (nur POST, GET antwortet 405) — bis v1 zeigte die Kachel dorthin. */
  { id:'backstage', icon:'🎭', url:VA + 'backstage.html',
    de:['Backstage','Dein Rollenbild, Unterlagen, Trainings und die Meldungen des Alltags.'],
    en:['Backstage','Your role, documents, trainings and the everyday notices.'] },
  { id:'vaikuntha', icon:'🌿', url:'', zeigt:'vaikuntha.eu',
    de:['Vaikuntha','Der Verein: Termine, Camp, Mitmachen.'],
    en:['Vaikuntha','The association: dates, camp, joining in.'] },
  /* 04.09.2026: das Finanz-Raumschiff — aus, bis portal.js eine Adresse einträgt
     (Bene: 'https://vishnuartists.com/raumschiff/'). Zeigt private Konten, deshalb
     nie Standard. */
  { id:'raumschiff', icon:'🚀', url:'',
    de:['Finanz-Raumschiff','Firma, privat, Verein, Luxemburg — ein Cockpit, ein Kurs.'],
    en:['Finance spaceship','Company, private, association, Luxembourg — one cockpit, one course.'] }
];

/* Die Portale des Kollektivs (Liste wie $INSTANZEN in publish-compass.ps1 plus bene.).
   Persönliche Portale öffnet die Tür nur der Person selbst und der Gründung
   (gate-config.php › $GATE_ROLLEN = gruender) — deshalb sehen alle anderen nur ihr eigenes. */
var PORTALE = ['bene','philipp','jan','marwan','florian','domingo','martin'];
function portalLinks(){
  var eigen = location.host.split('.')[0];
  var l = PORTALE.map(function(s){
    var x = { id:'p-' + s, icon:'🪷', url:'https://' + s + '.vishnuartists.com/', de:s + '.vishnuartists.com', en:s + '.vishnuartists.com' };
    if (s === eigen) { x.hier = true; x.offen = true; } else { x.darf = R.gruender; }
    return x;
  });
  l.push({ id:'va',   icon:'📊', url:'https://va.vishnuartists.com/',          darf:R.cockpit, de:'va.vishnuartists.com — Team-Cockpit', en:'va.vishnuartists.com — team cockpit' });
  l.push({ id:'demo', icon:'🎬', url:'https://demo.vishnuartists.com/',        offen:true,     de:'demo.vishnuartists.com — Compass-Demo', en:'demo.vishnuartists.com — Compass demo' });
  l.push({ id:'demo-cockpit', icon:'🎬', url:'https://demo.vishnuartists.com/cockpit/', offen:true, de:'demo.vishnuartists.com/cockpit — Cockpit-Starter', en:'demo.vishnuartists.com/cockpit — cockpit starter' });
  return l;
}

/* ---------- Bereiche: die Rückseiten (07.09.2026, v3 11.09.2026) --------------------
   Seit v3 folgen sie den Rechten: ein Bereich erscheint, sobald die Person mindestens eine
   seiner Zeilen öffnen darf. Die Regel steht am Link, sonst an der Spalte, sonst am Bereich:
     darf:[…]      eine dieser CRM-Rollen      crew:[…]   eine dieser Raumschiff-Rollen
     verein:'…'    mindestens diese Stufe      nur:'<kachel>'  nur, wenn die Kachel an ist
     offen:true    ohne Einschränkung (für Angemeldete)
   portal.js › bereiche: { crm:false } blendet trotzdem aus, ein Text setzt die Hauptadresse.
   Einzelne Zeilen: portal.js › links: { 'fap.stajira': false, 'crm.start': 'https://…' }.

function ziel(k){
  var c = P.kacheln || {};
  if (!(k.id in c)) return kachelStandard(k);
  var v = c[k.id];
  if (v === false) return '';
  if (v === true) return kachelStandard(k);
  return String(v || '');
}
function kachelAn(id){
  var k = STANDARD.filter(function(x){ return x.id === id; })[0];
  return !k || !!ziel(k);
}
/* Die Regel eines Links: die eigene, sonst die der Spalte, sonst die des Bereichs. */
function regel(){
  for (var i = 0; i < arguments.length; i++) {
    var o = arguments[i];
    if (o && (o.darf || o.crew || o.verein || o.nur || o.offen)) return o;
  }
  return {};
}
function erlaubt(o){
  if (o.darf && !o.darf.some(function(r){ return ROLLEN.indexOf(r) >= 0; })) return false;
  if (o.crew && o.crew.indexOf(CREW) < 0) return false;
  if (o.verein && (VSTUFE[VEREIN] || 0) < VSTUFE[o.verein]) return false;
  if (o.nur && !kachelAn(o.nur)) return false;
  return true;
}
/* Ein Bereich: portal.js › bereiche[id] === false blendet aus, ein Text ist die eigene
   Hauptadresse. Sonst entscheiden die Rechte (siehe zeichne()). */
function bereichAus(b){ var c = P.bereiche || {}; return c[b.id] === false; }
function bereichZiel(b){
  var c = P.bereiche || {};
  if (typeof c[b.id] === 'string') return c[b.id];
  if (!erlaubt(b)) return '';                  /* Bereich sichtbar, Hauptknopf nicht */
  return typeof b.url === 'function' ? b.url() : (b.url || '');
}
function linkZiel(b, l){
  var c = P.links || {};
  var k = b.id + '.' + l.id;
  if (!(k in c)) return l.url;
  var v = c[k];
  if (v === false) return '';
  if (v === true) return l.url;
  return String(v || '');
}
function host(u, zeigt){
  if (zeigt) return zeigt;
  if (u.charAt(0) === '.') return TEXTE[SPR].hier;
  try { return new URL(u, location.href).host; } catch(e) { return u; }
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
function extern(u){ return u.charAt(0) !== '.' && u.charAt(0) !== '#'; }
function aTag(u, klasse){
  return '<a' + (klasse ? ' class="' + klasse + '"' : '') + ' href="' + esc(u) + '"' +
         (extern(u) ? ' target="_blank" rel="noopener"' : '') + '>';
}

function zeichne(){
  var T = TEXTE[SPR];
  document.documentElement.lang = SPR;
  var h = new Date().getHours();
  var g = h < 11 ? T.gruss[0] : (h < 17 ? T.gruss[1] : T.gruss[2]);
  document.getElementById('gruss').innerHTML = esc(g) + (NAME ? ', <em>' + esc(NAME) + '</em>' : '');
  document.getElementById('lead').textContent = P.lead || T.lead;
  document.getElementById('kick').textContent = T.kick + ' · ' + location.host;
  document.getElementById('pill').textContent = T.pill;
  document.getElementById('knSprache').textContent = T.sprache;

  /* ---- Ebene: woher die Auswahl kommt, sichtbar statt stillschweigend ---- */
  var ix = SPR === 'en' ? 1 : 0, eb = '';
  ROLLEN.forEach(function(r){ if (NAMEN[r]) eb += '<span class="chip">' + esc(NAMEN[r][ix]) + '</span>'; });
  if (CREW && NAMEN[CREW]) eb += '<span class="chip v">🚀 ' + esc(T.crew) + ': ' + esc(NAMEN[CREW][ix]) + '</span>';
  if (VEREIN && NAMEN[VEREIN]) eb += '<span class="chip a">🌿 ' + esc(T.verein) + ': ' + esc(NAMEN[VEREIN][ix]) + '</span>';
  var ebEl = document.getElementById('ebene');
  ebEl.innerHTML = eb ? esc(T.ebene) + ' ' + eb + (ROLLEN_QUELLE ? ' <span>· ' + esc(ROLLEN_QUELLE === 'live' ? T.live : T.hinterlegt) + '</span>' : '') : '';
  ebEl.hidden = !eb;

  /* ---- Kacheln ---- */
  var n = 0, html = '';
  /* portal.js › haupt: '<id>' macht eine andere Kachel zur ersten und hervorgehobenen
     (06.09.2026: bei Martin ist es das Raumschiff, nicht der Compass). */
  var liste = STANDARD.slice();
  if (location.hostname === 'bene.vishnuartists.com') liste.push({id:'hotel-lobby',icon:'🏨',url:'./compass/#holodeck',de:['Aufzug zum Holodeck','John und Madeleine treffen — Bar, Berghütte, Goa, Anden oder Rom.'],en:['Elevator to the holodeck','Meet John and Madeleine — bar, mountain cabin, Goa, Andes or Rome.']});
  if (P.haupt) liste.sort(function(a, b){ return (a.id === P.haupt ? 0 : 1) - (b.id === P.haupt ? 0 : 1); });
  liste.forEach(function(k){
    var u = ziel(k); if (!u) return;
    n++;
    var t = k[SPR] || k.de;
    var haupt = P.haupt ? (k.id === P.haupt) : !!k.haupt;
    html += aTag(u, 'tile' + (haupt ? ' haupt' : '')).replace('<a ', '<a data-nr="' + n + '" ') +
            '<span class="kbd">' + n + '</span><span class="ic">' + k.icon + '</span>' +
            '<h2>' + esc(t[0]) + '</h2><p>' + esc(t[1]) + '</p>' +
            '<span class="go">' + esc(T.oeffnen) + ' →<span class="host">' + esc(host(u, k.zeigt)) + '</span></span></a>';
  });
  document.getElementById('grid').innerHTML = html;

  /* ---- Bereiche ---- */
  var ersetzt = {}, bh = '', nav = '';
  BEREICHE.forEach(function(b){
    if (bereichAus(b)) return;
    var t = b[SPR] || b.de, kick = b.kick[SPR === 'en' ? 1 : 0];
    var sp = '';
    b.spalten.forEach(function(s){
      var zeilen = '';
      s.links.forEach(function(l){
        if (!erlaubt(regel(l, s, b))) return;
        if (l.unter && (VSTUFE[VEREIN] || 0) >= VSTUFE[l.unter]) return;
        var lu = linkZiel(b, l); if (!lu) return;
        zeilen += '<li>' + aTag(lu, l.hier ? 'hier' : '') + '<span class="ic2">' + l.icon + '</span>' + esc(l[SPR] || l.de) +
                  (l.hier ? '<span class="ext">' + esc(T.duHier) + '</span>' : (l.zeigt ? '<span class="ext">' + esc(l.zeigt) + '</span>' : '')) + '</a></li>';
      });
      if (zeilen) sp += '<div class="spalte"><h4>' + esc(s[SPR] || s.de) + '</h4><ul>' + zeilen + '</ul></div>';
    });
    /* Nichts darin, was die Person öffnen dürfte → der Bereich erscheint gar nicht. */
    if (!sp) return;
    var u = bereichZiel(b);
    (b.ersetzt || []).forEach(function(id){ ersetzt[id] = true; });
    bh += '<section class="bereich" id="b-' + esc(b.id) + '"><div class="bk">' +
          '<span class="bic">' + b.icon + '</span><div class="bt"><p class="kick">' + esc(kick) + '</p>' +
          '<h2>' + esc(t[0]) + '</h2><p class="sub">' + esc(t[1]) + '</p></div>' +
          (u ? aTag(u, 'btn ghost') + esc(T.oeffnen) + ' → <span style="font-weight:600;color:var(--sub)">' + esc(host(u, b.zeigt)) + '</span></a>' : '') +
          '</div><div class="spalten">' + sp + '</div></section>';
    nav += '<a href="#b-' + esc(b.id) + '">' + esc(t[0]) + '</a>';
  });
  document.getElementById('bereiche').innerHTML = bh;
  document.getElementById('navlinks').innerHTML = nav;

  /* ---- Zweite Ebene ---- */
  var mehr = '';
  GRUPPEN.forEach(function(g){
    var zeilen = '';
    MEHR.forEach(function(k){
      if (k.gruppe !== g.id || ersetzt[k.id]) return;
      var c = P.mehr || {}, alt = P.neben || {};
      var wahl = (k.id in c) ? c[k.id] : ((k.id in alt) ? alt[k.id] : undefined);
      var u;
      if (wahl === undefined) { u = k.std ? k.url : ''; }
      else if (wahl === false) { u = ''; }
      else if (wahl === true)  { u = k.url; }
      else { u = String(wahl || ''); }
      if (!u) return;
      zeilen += '<li>' + aTag(u) + '<span class="ic2">' + k.icon + '</span>' + esc(k[SPR] || k.de) + '</a></li>';
    });
    if (zeilen) mehr += '<div><h3>' + esc(g[SPR] || g.de) + '</h3><ul>' + zeilen + '</ul></div>';
  });
  document.getElementById('mehr').innerHTML = mehr;
  document.getElementById('mehr').hidden = !mehr;

  var mail = P.mail || I.mail || 'hallo@vishnuartists.com';
  document.getElementById('fuss').innerHTML =
    (INSTANZ ? '<b>' + esc(INSTANZ) + '</b> · ' : '') + esc(T.fuss) +
    '<a href="mailto:' + esc(mail) + '">' + esc(mail) + '</a>';
}

/* ---------- Hell/Dunkel: derselbe Schlüssel wie im Compass --------------------------- */
function themeAn(){
  var t = null;
  try { t = localStorage.getItem('beneTheme'); } catch(e){}
  if (t !== 'light' && t !== 'dark') {
    var h = new Date().getHours();
    t = (h >= 6 && h < 18) ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('meta[name=theme-color]');
  if (m) m.setAttribute('content', t === 'dark' ? '#11150d' : '#faf8f2');
}
document.getElementById('knTheme').addEventListener('click', function(){
  var neu = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('beneTheme', neu); } catch(e){}
  themeAn();
});
document.getElementById('knSprache').addEventListener('click', function(){
  SPR = SPR === 'de' ? 'en' : 'de';
  try { localStorage.setItem('portalSprache', SPR); } catch(e){}
  zeichne();
});
/* Tasten 1..9 öffnen die Kacheln — wie die Kontextwechsel im Compass. */
document.addEventListener('keydown', function(e){
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^[1-9]$/.test(e.key)) {
    var a = document.querySelector('.tile[data-nr="' + e.key + '"]');
    if (a) a.click();
  }
});

themeAn();
zeichne();

/* ---------- Rollen live aus der Tür (v3) ---------------------------------------------
   gate.php kennt die Rollen seit dem 11.09.2026 aus weiter.php und gibt sie über ?wer=1
   zurück. rollen:null heißt: Türcookie von vorher, ohne Rollen — dann bleibt es bei
   portal.js, bis die Tür das Cookie spätestens nach vier Stunden neu ausstellt. Lokal (ohne
   Tür) antwortet niemand, und die Seite bleibt, wie sie ist. */
(function(){
  if (!window.fetch || location.protocol !== 'https:') return;
  fetch('/gate.php?wer=1', { credentials:'same-origin', cache:'no-store' })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.ok || !Array.isArray(j.rollen)) return;
      ROLLEN = j.rollen; ROLLEN_QUELLE = 'live';
      zeichne();
    })
    .catch(function(){});
})();

/* ---------- Als App installierbar ---------------------------------------------------- */
if ('serviceWorker' in navigator) {
  addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
/* Wer aus der früher installierten Compass-App kommt (Verknüpfung mit ?go=…), landet dort,
   wo er hinwollte — der Compass liegt seit dem 04.09.2026 in /compass/. */
(function(){
  var q = new URLSearchParams(location.search);
  if (q.get('go')) location.replace('./compass/' + location.search + location.hash);
})();
</script>
